<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallpaper Picks — Made by Amit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090a0f;
    --card-bg: rgba(22, 27, 38, 0.75);
    --card-border: rgba(255, 255, 255, 0.12);
    --gold: #ffd700;
    --gold-glow: rgba(255, 215, 0, 0.35);
    --neon-pink: #ff2a85;
    --neon-purple: #8a2be2;
    --neon-cyan: #00f2fe;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(255, 42, 133, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.1) 0%, transparent 60%);
    background-attachment: fixed;
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    padding: 60px 20px 40px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    position: relative;
  }

  .don-banner {
    font-family: 'Cinzel', serif;
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 900;
    letter-spacing: 0.12em;
    color: var(--gold);
    text-transform: uppercase;
    text-shadow: 
      0 0 10px var(--gold-glow),
      0 0 25px var(--gold-glow),
      0 0 45px rgba(255, 215, 0, 0.5);
    margin-bottom: 10px;
    animation: pulse 3s infinite alternate;
  }

  @keyframes pulse {
    0% { filter: drop-shadow(0 0 10px rgba(255,215,0,0.4)); }
    100% { filter: drop-shadow(0 0 20px rgba(255,215,0,0.8)); }
  }

  .subtitle {
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 800;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }

  header p {
    color: var(--text-muted);
    font-size: 15px;
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* ---------- Grid Layout ---------- */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 50px 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 28px;
  }

  /* ---------- Glassmorphism Card ---------- */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(255, 42, 133, 0.5);
    box-shadow: 0 12px 30px rgba(255, 42, 133, 0.2);
  }

  .thumb-wrap {
    position: relative;
    aspect-ratio: 16/10;
    overflow: hidden;
    background: #000;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .card:hover .thumb-wrap img {
    transform: scale(1.08);
  }

  .tag {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--neon-cyan);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
  }

  .card-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
  }

  .title {
    font-size: 18px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.3;
  }

  .actions {
    margin-top: auto;
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .btn-preview {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .btn-preview:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
  }

  .btn-open {
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    color: #fff;
    box-shadow: 0 4px 15px rgba(255, 42, 133, 0.3);
  }

  .btn-open:hover {
    filter: brightness(1.2);
    box-shadow: 0 6px 20px rgba(255, 42, 133, 0.5);
  }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(4, 5, 8, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 30px;
    z-index: 1000;
  }

  .lightbox.open { display: flex; }

  .lightbox-inner {
    max-width: 1100px;
    width: 100%;
    background: rgba(22, 27, 38, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
  }

  .lightbox img {
    width: 100%;
    max-height: 70vh;
    object-fit: contain;
    border-radius: 12px;
    background: #000;
  }

  .lightbox-bar {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .lightbox-bar .title {
    font-size: 20px;
    color: var(--neon-cyan);
  }

  .lightbox-close {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-main);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
  }

  .lightbox-close:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: #fff;
  }

  /* ---------- Footer ---------- */
  footer {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 30px 20px 50px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  .footer-credit {
    margin-top: 8px;
    font-weight: 800;
    font-size: 16px;
    color: var(--gold);
    letter-spacing: 0.05em;
    text-shadow: 0 0 10px var(--gold-glow);
  }
</style>
</head>
<body>

<header>
  <div class="don-banner">AMIT IS THE DON</div>
  <div class="subtitle">Live Wallpaper Vault</div>
  <p>Select any animated theme below to preview instantly or head directly to the original page for downloads.</p>
</header>

<main id="wallpaper-grid"></main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <img id="lightbox-img" src="" alt="Wallpaper Preview">
    <div class="lightbox-bar">
      <div class="title" id="lightbox-title"></div>
      <div style="display:flex; gap:12px;">
        <a class="btn btn-open" id="lightbox-open" href="#" target="_blank" rel="noopener noreferrer">Get Wallpaper</a>
        <button class="lightbox-close" onclick="closeLightbox()">Close</button>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>Thumbnails linked directly to original assets on <a href="https://motionbgs.com" target="_blank" style="color:var(--neon-cyan); text-decoration:none;">motionbgs.com</a>.</p>
  <div class="footer-credit">(made by Amit.)</div>
</footer>

<script>
  // Dynamic Items Array including new requested links
  const wallpapers = [
    {
      title: "Twilight at Mount Fuji",
      tag: "Nature / Anime",
      img: "https://motionbgs.com/media/9924/twilight-at-mount-fuji.3840x2160.jpg",
      link: "https://motionbgs.com/twilight-at-mount-fuji"
    },
    {
      title: "King of Darkness",
      tag: "Fantasy",
      img: "https://motionbgs.com/media/9821/dark-king-and-the-crown-of-thorns.3840x2160.jpg",
      link: "https://motionbgs.com/king-of-darkness"
    },
    {
      title: "Serene Cherry Blossom Tree",
      tag: "Atmospheric",
      img: "https://motionbgs.com/media/9925/serene-cherry-blossom-tree.3840x2160.jpg",
      link: "https://motionbgs.com/serene-cherry-blossom-tree"
    },
    {
      title: "Eren Yeager — Founding Titan",
      tag: "Attack on Titan",
      img: "https://motionbgs.com/media/990/eren-yeager-from-founding-titan-attack-on-titan.jpg",
      link: "https://motionbgs.com/eren-yeager-from-founding-titan-attack-on-titan"
    },
    {
      title: "Shadow King — Sung Jin-Woo",
      tag: "Solo Leveling",
      img: "https://motionbgs.com/media/9692/shadow-king-sung-jin-woo.3840x2160.jpg",
      link: "https://motionbgs.com/shadow-king-sung-jin-woo"
    },
    {
      title: "Mikasa Ackerman",
      tag: "Attack on Titan",
      img: "https://motionbgs.com/media/5180/mikasa-aot.jpg",
      link: "https://motionbgs.com/mikasa-aot"
    },
    {
      title: "Titan Rage",
      tag: "Attack on Titan",
      img: "https://motionbgs.com/media/4608/titan-rage.jpg",
      link: "https://motionbgs.com/titan-rage"
    },
    {
      title: "Surviving",
      tag: "The Last of Us",
      img: "https://motionbgs.com/media/501/surviving-the-last-of-us.jpg",
      link: "https://motionbgs.com/surviving-the-last-of-us"
    },
    {
      title: "The Arcade",
      tag: "The Last of Us",
      img: "https://motionbgs.com/media/583/the-arcade-the-last-of-us.jpg",
      link: "https://motionbgs.com/the-arcade-the-last-of-us"
    }
  ];

  // Render cards into DOM
  const grid = document.getElementById('wallpaper-grid');
  
  wallpapers.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb-wrap">
        <span class="tag">${item.tag}</span>
        <img src="${item.img}" alt="${item.title}" loading="lazy" onerror="this.src='https://picsum.photos/800/500?random=${idx}'">
      </div>
      <div class="card-body">
        <div class="title">${item.title}</div>
        <div class="actions">
          <button class="btn btn-preview" onclick="openLightbox('${item.img}', '${item.title.replace(/'/g, "\\'")}', '${item.link}')">Preview</button>
          <a class="btn btn-open" href="${item.link}" target="_blank" rel="noopener noreferrer">Open</a>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  // Lightbox Handler
  function openLightbox(imgUrl, title, sourceLink) {
    const imgEl = document.getElementById('lightbox-img');
    imgEl.src = imgUrl;
    imgEl.onerror = () => { imgEl.src = 'https://picsum.photos/1200/800'; };
    document.getElementById('lightbox-title').textContent = title;
    document.getElementById('lightbox-open').href = sourceLink;
    document.getElementById('lightbox').classList.add('open');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightbox-img').src = '';
  }

  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
  });
</script>

</body>
</html>
