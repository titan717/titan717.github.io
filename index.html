<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cool Website by Amit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #141417;
    --border: #27272a;
    --border-hover: #52525b;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --accent: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Game-Style Loading Screen ---------- */
  #loader {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease, visibility 0.6s;
  }

  #loader.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .loader-title {
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 30px;
    text-transform: uppercase;
    animation: pulse 1.5s infinite alternate;
  }

  .progress-bar-container {
    width: 250px;
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--text);
    transition: width 0.2s ease;
  }

  @keyframes pulse {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    padding: 80px 20px 40px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  header p {
    color: var(--text-muted);
    font-size: 16px;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* ---------- Controls (Search & Filters) ---------- */
  .controls {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }

  .search-box {
    width: 100%;
    max-width: 400px;
    padding: 14px 20px;
    border-radius: 30px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s;
  }

  .search-box:focus {
    border-color: var(--border-hover);
  }

  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover {
    border-color: var(--border-hover);
    color: var(--text);
  }

  .filter-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
    font-weight: 600;
  }

  /* ---------- Grid Layout ---------- */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    min-height: 50vh;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-muted);
    font-size: 18px;
    padding: 40px;
  }

  /* ---------- Card Styling ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--border-hover);
  }

  .thumb-wrap {
    position: relative;
    aspect-ratio: 16/10;
    overflow: hidden;
    background: #000;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .card:hover .thumb-wrap img {
    transform: scale(1.05);
  }

  .tag {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(10, 10, 12, 0.8);
    backdrop-filter: blur(4px);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 20px;
  }

  .card-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
  }

  .title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }

  .actions {
    margin-top: auto;
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
  }

  .btn-preview {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }

  .btn-preview:hover {
    border-color: var(--text-muted);
    background: rgba(255, 255, 255, 0.03);
  }

  .btn-open {
    background: var(--text);
    color: var(--bg);
  }

  .btn-open:hover {
    background: #d4d4d8;
  }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 12, 0.95);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .lightbox.open { 
    display: flex; 
    opacity: 1;
  }

  .lightbox-inner {
    max-width: 1200px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .lightbox img {
    width: 100%;
    max-height: 75vh;
    object-fit: contain;
    border-radius: 12px;
    background: #000;
  }

  .lightbox-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .lightbox-bar .title {
    font-size: 24px;
  }

  .lightbox-close {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .lightbox-close:hover {
    border-color: var(--text);
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 40px 20px 60px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  .footer-credit {
    margin-top: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loader">
  <div class="loader-title">Initiating sequence...</div>
  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
</div>

<header>
  <h1>Cool Website By Amit</h1>
  <p>A curated collection of animated wallpapers. Filter, search, and preview in high resolution before downloading.</p>
</header>

<!-- Search & Filters -->
<div class="controls">
  <input type="text" id="searchInput" class="search-box" placeholder="Search wallpapers by title or tag...">
  <div class="filters" id="filterContainer">
    <!-- Filter tabs generate dynamically via JS -->
  </div>
</div>

<main id="wallpaper-grid"></main>

<!-- Lightbox Modal -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <img id="lightbox-img" src="" alt="Wallpaper Preview">
    <div class="lightbox-bar">
      <div class="title" id="lightbox-title"></div>
      <div style="display:flex; gap:12px;">
        <a class="btn btn-open" id="lightbox-open" href="#" target="_blank" rel="noopener noreferrer">Get Wallpaper</a>
        <button class="lightbox-close" onclick="closeLightbox()">Close</button>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>All wall art assets belong to their respective creators on <a href="https://motionbgs.com" target="_blank" style="color:var(--text); text-decoration:underline;">motionbgs.com</a>.</p>
  <div class="footer-credit">Cool Website by Amit</div>
</footer>

<script>
  /* =========================================
     HOW TO ADD NEW LINKS EASILY:
     Just copy one of the blocks inside the 
     wallpapers array below. 
     
     If you don't know the exact .jpg link, 
     leave it blank or use a random image, 
     and the 'fallback' will load a cool 
     placeholder image automatically so the 
     site never breaks!
  ========================================== */

  const wallpapers = [
    // --- NEW LINKS YOU ADDED ---
    {
      title: "Minecraft Northern Light",
      tag: "Minecraft",
      img: "", // Intentionally empty so fallback activates
      fallback: "https://images.unsplash.com/photo-1579033461387-adb47197eb43?q=80&w=1200", 
      link: "https://motionbgs.com/minecraft-northern-light"
    },
    {
      title: "Full Moon Elden Ring",
      tag: "Gaming",
      img: "",
      fallback: "https://images.unsplash.com/photo-1514320291840-2e0a9bf2a9ae?q=80&w=1200",
      link: "https://motionbgs.com/full-moon-elden-ring"
    },
    {
      title: "Ghost of Tsushima Bloodfall",
      tag: "Gaming",
      img: "",
      fallback: "https://images.unsplash.com/photo-1528359850684-245ed76e10f1?q=80&w=1200",
      link: "https://motionbgs.com/ghost-of-tsushima-bloodfall"
    },
    {
      title: "Minecraft Rainy Cabin",
      tag: "Minecraft",
      img: "",
      fallback: "https://images.unsplash.com/photo-1518780664697-55e3ad937233?q=80&w=1200",
      link: "https://motionbgs.com/minecraft-rainy-cabin"
    },
    {
      title: "Path of Fallen Leaves",
      tag: "Nature",
      img: "",
      fallback: "https://images.unsplash.com/photo-1476820865390-c52aeebb9891?q=80&w=1200",
      link: "https://motionbgs.com/path-of-fallen-leaves"
    },
    {
      title: "Red Ghost",
      tag: "Atmospheric",
      img: "",
      fallback: "https://images.unsplash.com/photo-1509249738096-7a87bd04b503?q=80&w=1200",
      link: "https://motionbgs.com/red-ghost"
    },
    // --- PREVIOUS LINKS ---
    {
      title: "Twilight at Mount Fuji",
      tag: "Nature",
      img: "https://motionbgs.com/media/9924/twilight-at-mount-fuji.3840x2160.jpg",
      fallback: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1200",
      link: "https://motionbgs.com/twilight-at-mount-fuji"
    },
    {
      title: "King of Darkness",
      tag: "Fantasy",
      img: "https://motionbgs.com/media/9821/dark-king-and-the-crown-of-thorns.3840x2160.jpg",
      fallback: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200",
      link: "https://motionbgs.com/dark-king-and-the-crown-of-thorns"
    },
    {
      title: "Serene Cherry Blossom Tree",
      tag: "Anime",
      img: "https://motionbgs.com/media/9925/serene-cherry-blossom-tree.3840x2160.jpg",
      fallback: "https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1200",
      link: "https://motionbgs.com/serene-cherry-blossom-tree"
    },
    {
      title: "Shadow King — Sung Jin-Woo",
      tag: "Anime",
      img: "https://motionbgs.com/media/9692/shadow-king-sung-jin-woo.3840x2160.jpg",
      fallback: "https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=1200",
      link: "https://motionbgs.com/shadow-king-sung-jin-woo"
    },
    {
      title: "The Arcade",
      tag: "Gaming",
      img: "https://motionbgs.com/media/583/the-arcade-the-last-of-us.jpg",
      fallback: "https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200",
      link: "https://motionbgs.com/the-arcade-the-last-of-us"
    }
  ];

  // Logic Variables
  const grid = document.getElementById('wallpaper-grid');
  const filterContainer = document.getElementById('filterContainer');
  const searchInput = document.getElementById('searchInput');
  let currentFilter = 'All';
  let searchQuery = '';

  // 1. Game Style Loading Screen Logic
  window.addEventListener('load', () => {
    let progress = 0;
    const bar = document.getElementById('progress-bar');
    const interval = setInterval(() => {
      progress += Math.floor(Math.random() * 20) + 10; // random jump
      if (progress >= 100) {
        progress = 100;
        clearInterval(interval);
        setTimeout(() => {
          document.getElementById('loader').classList.add('hidden');
        }, 400); // slight delay after hitting 100%
      }
      bar.style.width = progress + '%';
    }, 150);
  });

  // 2. Setup Category Filters dynamically
  function setupFilters() {
    // Get unique tags
    const tags = ['All', ...new Set(wallpapers.map(w => w.tag))];
    
    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (tag === 'All' ? ' active' : '');
      btn.textContent = tag;
      btn.onclick = () => {
        // Update active class
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        currentFilter = tag;
        renderGrid();
      };
      filterContainer.appendChild(btn);
    });
  }

  // 3. Render the Grid
  function renderGrid() {
    grid.innerHTML = ''; // clear current

    // Filter logic
    const filtered = wallpapers.filter(item => {
      const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            item.tag.toLowerCase().includes(searchQuery.toLowerCase());
      const matchesTag = currentFilter === 'All' || item.tag === currentFilter;
      return matchesSearch && matchesTag;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state">No wallpapers found matching your search.</div>`;
      return;
    }

    filtered.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'card';
      
      // Select main img, or use fallback instantly if main is blank
      const primaryImg = item.img ? item.img : item.fallback;

      card.innerHTML = `
        <div class="thumb-wrap">
          <span class="tag">${item.tag}</span>
          <img src="${primaryImg}" alt="${item.title}" loading="lazy" onerror="this.onerror=null; this.src='${item.fallback}';">
        </div>
        <div class="card-body">
          <div class="title">${item.title}</div>
          <div class="actions">
            <button class="btn btn-preview" onclick="openLightbox('${primaryImg}', '${item.fallback}', '${item.title.replace(/'/g, "\\'")}', '${item.link}')">Preview</button>
            <a class="btn btn-open" href="${item.link}" target="_blank" rel="noopener noreferrer">Open Link</a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // 4. Search input event
  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderGrid();
  });

  // 5. Lightbox Functions
  function openLightbox(imgUrl, fallbackUrl, title, sourceLink) {
    const lightbox = document.getElementById('lightbox');
    const imgEl = document.getElementById('lightbox-img');
    
    imgEl.onerror = function() {
      this.onerror = null;
      this.src = fallbackUrl;
    };
    imgEl.src = imgUrl;

    document.getElementById('lightbox-title').textContent = title;
    document.getElementById('lightbox-open').href = sourceLink;
    
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    const lightbox = document.getElementById('lightbox');
    lightbox.classList.remove('open');
    setTimeout(() => {
      document.getElementById('lightbox-img').src = '';
    }, 300);
  }

  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
  });

  // Initialize
  setupFilters();
  renderGrid();

</script>
</body>
</html>
