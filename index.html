<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cool Website by Amit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #141417;
    --border: #27272a;
    --border-hover: #52525b;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --accent: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Game Loading Screen ---------- */
  #loader {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease, visibility 0.5s;
  }

  #loader.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .loader-title {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 24px;
    text-transform: uppercase;
    animation: pulse 1.2s infinite alternate;
  }

  .progress-bar-container {
    width: 260px;
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--text);
    transition: width 0.15s ease;
  }

  @keyframes pulse {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    padding: 70px 20px 30px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(32px, 5.5vw, 60px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  header p {
    color: var(--text-muted);
    font-size: 15px;
    max-width: 550px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* ---------- Controls & Filters ---------- */
  .controls {
    max-width: 1400px;
    margin: 0 auto;
    padding: 10px 24px 30px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }

  .search-box {
    width: 100%;
    max-width: 420px;
    padding: 12px 20px;
    border-radius: 30px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .search-box:focus {
    border-color: var(--border-hover);
  }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .filter-btn:hover {
    border-color: var(--border-hover);
    color: var(--text);
  }

  .filter-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
    font-weight: 600;
  }

  /* ---------- Grid Layout ---------- */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 24px;
    min-height: 40vh;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-muted);
    font-size: 16px;
    padding: 60px 20px;
  }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease, border-color 0.25s ease;
    cursor: pointer;
    user-select: none;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--border-hover);
  }

  .thumb-wrap {
    position: relative;
    aspect-ratio: 16/10;
    overflow: hidden;
    background: #000;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .card:hover .thumb-wrap img {
    transform: scale(1.05);
  }

  .tag {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(10, 10, 12, 0.85);
    backdrop-filter: blur(4px);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
  }

  .card-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }

  .title {
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }

  .hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: -6px;
  }

  .actions {
    margin-top: auto;
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
  }

  .btn-preview {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }

  .btn-preview:hover {
    border-color: var(--text-muted);
    background: rgba(255, 255, 255, 0.04);
  }

  .btn-open {
    background: var(--text);
    color: var(--bg);
  }

  .btn-open:hover {
    background: #e4e4e7;
  }

  /* ---------- Lightbox Modal ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 12, 0.94);
    backdrop-filter: blur(12px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .lightbox.open { 
    display: flex; 
    opacity: 1;
  }

  .lightbox-inner {
    max-width: 1100px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .lightbox img {
    width: 100%;
    max-height: 75vh;
    object-fit: contain;
    border-radius: 12px;
    background: #000;
  }

  .lightbox-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .lightbox-bar .title {
    font-size: 22px;
  }

  .lightbox-close {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    transition: border-color 0.2s ease;
  }

  .lightbox-close:hover {
    border-color: var(--text);
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 30px 20px 50px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .footer-credit {
    margin-top: 10px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-title">Loading Vault...</div>
  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
</div>

<header>
  <h1>Cool Website By Amit</h1>
  <p>Collection of high quality animated wallpapers. Click Preview or double click any card to visit source.</p>
</header>

<div class="controls">
  <input type="text" id="searchInput" class="search-box" placeholder="Search by title or tag...">
  <div class="filters" id="filterContainer"></div>
</div>

<main id="wallpaper-grid"></main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <img id="lightbox-img" src="" alt="Wallpaper Preview">
    <div class="lightbox-bar">
      <div class="title" id="lightbox-title"></div>
      <div style="display:flex; gap:10px;">
        <a class="btn btn-open" id="lightbox-open" href="#" target="_blank" rel="noopener noreferrer">Get Wallpaper</a>
        <button class="lightbox-close" onclick="closeLightbox()">Close</button>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>Assets linked to original creators on <a href="https://motionbgs.com" target="_blank" style="color:var(--text); text-decoration:underline;">motionbgs.com</a>.</p>
  <div class="footer-credit">(made by Amit.)</div>
</footer>

<script>
  const wallpapers = [
    // Previous wallpapers
    {
      title: "Dark King and Crown of Thorns",
      tag: "Fantasy",
      img: "https://motionbgs.com/media/9821/dark-king-and-the-crown-of-thorns.3840x2160.jpg",
      fallback: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200",
      link: "https://motionbgs.com/dark-king-and-the-crown-of-thorns"
    },
    {
      title: "Eren Yeager — Founding Titan",
      tag: "Attack on Titan",
      img: "https://motionbgs.com/media/990/eren-yeager-from-founding-titan-attack-on-titan.jpg",
      fallback: "https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1200",
      link: "https://motionbgs.com/eren-yeager-from-founding-titan-attack-on-titan"
    },
    {
      title: "Shadow King — Sung Jin-Woo",
      tag: "Solo Leveling",
      img: "https://motionbgs.com/media/9692/shadow-king-sung-jin-woo.3840x2160.jpg",
      fallback: "https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=1200",
      link: "https://motionbgs.com/shadow-king-sung-jin-woo"
    },
    {
      title: "Mikasa (AOT)",
      tag: "Attack on Titan",
      img: "https://motionbgs.com/media/5180/mikasa-aot.jpg",
      fallback: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1200",
      link: "https://motionbgs.com/mikasa-aot"
    },
    {
      title: "Titan Rage",
      tag: "Attack on Titan",
      img: "https://motionbgs.com/media/4608/titan-rage.jpg",
      fallback: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1200",
      link: "https://motionbgs.com/titan-rage"
    },
    {
      title: "Surviving (The Last of Us)",
      tag: "The Last of Us",
      img: "https://motionbgs.com/media/501/surviving-the-last-of-us.jpg",
      fallback: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1200",
      link: "https://motionbgs.com/surviving-the-last-of-us"
    },
    {
      title: "The Arcade (The Last of Us)",
      tag: "The Last of Us",
      img: "https://motionbgs.com/media/583/the-arcade-the-last-of-us.jpg",
      fallback: "https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200",
      link: "https://motionbgs.com/the-arcade-the-last-of-us"
    },
    {
      title: "Twilight at Mount Fuji",
      tag: "Nature",
      img: "https://motionbgs.com/media/9924/twilight-at-mount-fuji.3840x2160.jpg",
      fallback: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1200",
      link: "https://motionbgs.com/twilight-at-mount-fuji"
    },
    {
      title: "Serene Cherry Blossom Tree",
      tag: "Anime",
      img: "https://motionbgs.com/media/9925/serene-cherry-blossom-tree.3840x2160.jpg",
      fallback: "https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1200",
      link: "https://motionbgs.com/serene-cherry-blossom-tree"
    },
    // Added links
    {
      title: "Minecraft Northern Light",
      tag: "Minecraft",
      img: "https://images.unsplash.com/photo-1579033461387-adb47197eb43?q=80&w=1200",
      fallback: "https://images.unsplash.com/photo-1579033461387-adb47197eb43?q=80&w=1200",
      link: "https://motionbgs.com/minecraft-northern-light"
    },
    {
      title: "Full Moon Elden Ring",
      tag: "Gaming",
      img: "https://images.unsplash.com/photo-1514320291840-2e0a9bf2a9ae?q=80&w=1200",
      fallback: "https://images.unsplash.com/photo-1514320291840-2e0a9bf2a9ae?q=80&w=1200",
      link: "https://motionbgs.com/full-moon-elden-ring"
    },
    {
      title: "Ghost of Tsushima Bloodfall",
      tag: "Gaming",
      img: "https://images.unsplash.com/photo-1528359850684-245ed76e10f1?q=80&w=1200",
      fallback: "https://images.unsplash.com/photo-1528359850684-245ed76e10f1?q=80&w=1200",
      link: "https://motionbgs.com/ghost-of-tsushima-bloodfall"
    },
    {
      title: "Minecraft Rainy Cabin",
      tag: "Minecraft",
      img: "https://images.unsplash.com/photo-1518780664697-55e3ad937233?q=80&w=1200",
      fallback: "https://images.unsplash.com/photo-1518780664697-55e3ad937233?q=80&w=1200",
      link: "https://motionbgs.com/minecraft-rainy-cabin"
    },
    {
      title: "Path of Fallen Leaves",
      tag: "Nature",
      img: "https://images.unsplash.com/photo-1476820865390-c52aeebb9891?q=80&w=1200",
      fallback: "https://images.unsplash.com/photo-1476820865390-c52aeebb9891?q=80&w=1200",
      link: "https://motionbgs.com/path-of-fallen-leaves"
    },
    {
      title: "Red Ghost",
      tag: "Atmospheric",
      img: "https://images.unsplash.com/photo-1509249738096-7a87bd04b503?q=80&w=1200",
      fallback: "https://images.unsplash.com/photo-1509249738096-7a87bd04b503?q=80&w=1200",
      link: "https://motionbgs.com/red-ghost"
    }
  ];

  const grid = document.getElementById('wallpaper-grid');
  const filterContainer = document.getElementById('filterContainer');
  const searchInput = document.getElementById('searchInput');
  let currentFilter = 'All';
  let searchQuery = '';

  // Loading animation
  window.addEventListener('load', () => {
    let progress = 0;
    const bar = document.getElementById('progress-bar');
    const interval = setInterval(() => {
      progress += Math.floor(Math.random() * 25) + 15;
      if (progress >= 100) {
        progress = 100;
        clearInterval(interval);
        setTimeout(() => {
          document.getElementById('loader').classList.add('hidden');
        }, 300);
      }
      bar.style.width = progress + '%';
    }, 100);
  });

  // Filter Bar Setup
  function setupFilters() {
    const tags = ['All', ...new Set(wallpapers.map(w => w.tag))];
    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (tag === 'All' ? ' active' : '');
      btn.textContent = tag;
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = tag;
        renderGrid();
      };
      filterContainer.appendChild(btn);
    });
  }

  // Render Grid
  function renderGrid() {
    grid.innerHTML = '';

    const filtered = wallpapers.filter(item => {
      const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            item.tag.toLowerCase().includes(searchQuery.toLowerCase());
      const matchesTag = currentFilter === 'All' || item.tag === currentFilter;
      return matchesSearch && matchesTag;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state">No wallpapers found matching your search.</div>`;
      return;
    }

    filtered.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'card';
      
      // QOL: Double Click card opens link directly
      card.ondblclick = () => {
        window.open(item.link, '_blank');
      };

      card.innerHTML = `
        <div class="thumb-wrap">
          <span class="tag">${item.tag}</span>
          <img src="${item.img}" alt="${item.title}" loading="lazy" onerror="this.onerror=null; this.src='${item.fallback}';">
        </div>
        <div class="card-body">
          <div class="title">${item.title}</div>
          <div class="hint">Double-click to open page</div>
          <div class="actions">
            <button class="btn btn-preview" onclick="event.stopPropagation(); openLightbox('${item.img}', '${item.fallback}', '${item.title.replace(/'/g, "\\'")}', '${item.link}')">Preview</button>
            <a class="btn btn-open" href="${item.link}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">Open</a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderGrid();
  });

  // Lightbox Modal
  function openLightbox(imgUrl, fallbackUrl, title, sourceLink) {
    const lightbox = document.getElementById('lightbox');
    const imgEl = document.getElementById('lightbox-img');
    
    imgEl.onerror = function() {
      this.onerror = null;
      this.src = fallbackUrl;
    };
    imgEl.src = imgUrl;

    document.getElementById('lightbox-title').textContent = title;
    document.getElementById('lightbox-open').href = sourceLink;
    
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    const lightbox = document.getElementById('lightbox');
    lightbox.classList.remove('open');
    setTimeout(() => {
      document.getElementById('lightbox-img').src = '';
    }, 250);
  }

  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
  });

  setupFilters();
  renderGrid();
</script>
</body>
</html>
