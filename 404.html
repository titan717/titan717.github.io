<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rumbling</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000000;
            cursor: pointer;
        }

        /* Fullscreen Viewport Video Container */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        /* Heavy scale zoom to aggressively crop edges and player branding */
        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio */
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%) scale(1.6);
            pointer-events: none;
        }

        /* Subtle bottom gradient overlay for the Back button */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: linear-gradient(180deg, transparent 75%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
        }

        /* UI Container */
        .container {
            position: relative;
            z-index: 3;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 30px 20px;
        }

        .btn-goback {
            display: inline-block;
            padding: 12px 30px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Cinzel', 'Times New Roman', serif;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(239, 68, 68, 0.7);
            border-radius: 2px;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .btn-goback:hover {
            color: #000000;
            background-color: #ef4444;
            border-color: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.9);
        }
    </style>
</head>
<body>

    <!-- Video Container with YouTube API enabled -->
    <div class="video-container">
        <div id="player"></div>
    </div>

    <div class="overlay"></div>

    <div class="container">
        <a href="javascript:history.back()" class="btn-goback">← Go Back</a>
    </div>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;

        // Initialize the YouTube player
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: '9TCphIzY--g',
                playerVars: {
                    'start': 1055,        // Start at 17:35
                    'autoplay': 1,
                    'controls': 0,
                    'showinfo': 0,
                    'rel': 0,
                    'iv_load_policy': 3,
                    'disablekb': 1,
                    'modestbranding': 1,
                    'loop': 1,
                    'playlist': '9TCphIzY--g'
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            // Apply frame styling to match the background video
            const iframe = document.getElementById('player');
            iframe.classList.add('bg-video');
            event.target.playVideo();
        }

        // Single click anywhere on screen enables Fullscreen & Audio (Bypasses Browser Restrictions)
        document.body.addEventListener('click', function(e) {
            // Avoid triggering when clicking the Go Back link directly
            if (e.target.tagName.toLowerCase() === 'a') return;

            // 1. Unmute and play sound
            if (player && player.unMute) {
                player.unMute();
                player.setVolume(100);
            }

            // 2. Hide Taskbar and Browser Tabs (Native Fullscreen)
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen();
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            } else if (docEl.msRequestFullscreen) {
                docEl.msRequestFullscreen();
            }
        });
    </script>

</body>
</html>
