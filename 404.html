<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rumbling</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Cinzel', 'Times New Roman', serif;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
        }

        /* Fullscreen Viewport Video Container */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        /* Heavy scale zoom to crop out any potential player artifacts */
        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio */
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%) scale(1.6); /* Cropped extra edges */
            pointer-events: none;
            filter: brightness(0.85) contrast(1.1);
        }

        /* Dark Vignette to keep bottom UI readable */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: linear-gradient(180deg, transparent 60%, rgba(0, 0, 0, 0.9) 100%);
            pointer-events: none;
        }

        /* UI Container */
        .container {
            position: relative;
            z-index: 3;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        /* Bottom Controls Container */
        .bottom-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(239, 68, 68, 0.8);
            border-radius: 2px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            cursor: pointer;
        }

        .btn:hover {
            color: #000000;
            background-color: #ef4444;
            border-color: #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.9);
        }
    </style>
</head>
<body onclick="enableFullscreen()">

    <!-- Starts at 17:35 (1055 seconds) and loops continuously -->
    <div class="video-container">
        <iframe 
            class="bg-video" 
            src="https://www.youtube-nocookie.com/embed/9TCphIzY--g?start=1055&autoplay=1&mute=1&loop=1&playlist=9TCphIzY--g&controls=0&showinfo=0&rel=0&iv_load_policy=3&disablekb=1&modestbranding=1" 
            title="Attack on Titan Video Background" 
            frameborder="0" 
            allow="autoplay; encrypted-media">
        </iframe>
    </div>

    <div class="overlay"></div>

    <div class="container">
        <!-- Bottom Action Bar -->
        <div class="bottom-nav">
            <button class="btn" onclick="enableFullscreen()">🖥️ Fullscreen (Hide Tabs/Taskbar)</button>
            <a href="javascript:history.back()" class="btn">← Go Back</a>
        </div>
    </div>

    <script>
        // Removes taskbar and browser tab bar by triggering Native Browser Fullscreen Mode
        function enableFullscreen() {
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen();
            } else if (docEl.mozRequestFullScreen) { /* Firefox */
                docEl.mozRequestFullScreen();
            } else if (docEl.webkitRequestFullscreen) { /* Chrome, Safari & Opera */
                docEl.webkitRequestFullscreen();
            } else if (docEl.msRequestFullscreen) { /* IE/Edge */
                docEl.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
