<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Trampled</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Cinzel', 'Times New Roman', serif;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
        }

        /* Video Container - Cover the whole viewport */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        /* YouTube iFrame Scaled to remove black bars */
        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio */
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%) scale(1.35);
            pointer-events: none;
            filter: brightness(0.7) contrast(1.15);
        }

        /* Subtle overlay to make text pop */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.85) 90%);
            pointer-events: none;
        }

        /* Center Content UI */
        .container {
            position: relative;
            z-index: 3;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
        }

        .header-content {
            margin-top: auto;
            margin-bottom: auto;
        }

        .error-code {
            font-size: clamp(6rem, 16vw, 12rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.8), 0 0 80px rgba(0, 0, 0, 0.9);
        }

        h1 {
            font-size: clamp(1rem, 2.5vw, 1.6rem);
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #fca5a5;
            margin-top: 10px;
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.9);
        }

        /* Bottom "Go Back" Navigation */
        .bottom-nav {
            margin-bottom: 20px;
        }

        .btn-goback {
            display: inline-block;
            padding: 14px 38px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(239, 68, 68, 0.8);
            border-radius: 2px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
        }

        .btn-goback:hover {
            color: #000000;
            background-color: #ef4444;
            border-color: #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.9);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Background Video Clip from https://www.youtube.com/watch?v=9TCphIzY--g starting at 21:00 (1260 seconds) -->
    <div class="video-container">
        <iframe 
            class="bg-video" 
            src="https://www.youtube-nocookie.com/embed/9TCphIzY--g?start=1260&autoplay=1&mute=1&loop=1&playlist=9TCphIzY--g&controls=0&showinfo=0&rel=0&iv_load_policy=3&disablekb=1&modestbranding=1" 
            title="Attack on Titan - Rumbling Speech Video Background" 
            frameborder="0" 
            allow="autoplay; encrypted-media">
        </iframe>
    </div>

    <div class="overlay"></div>

    <div class="container">
        <div class="header-content">
            <div class="error-code">404</div>
            <h1>THIS PAGE HAS BEEN TRAMPLED</h1>
        </div>

        <!-- Bottom Go Back Action -->
        <div class="bottom-nav">
            <a href="javascript:history.back()" class="btn-goback">← Go Back</a>
        </div>
    </div>

</body>
</html>
